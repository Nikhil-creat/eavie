limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
server {
  listen 80;
  server_name _;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  location = /healthz { return 200 "ok"; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
  location /api/ {
    limit_req zone=perip burst=40 nodelay;
    proxy_pass http://api_gateway:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_buffering off;          # SSE token streaming
    proxy_read_timeout 300s;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
  }
}
# TLS: add `listen 443 ssl; ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem;`
